<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placement Prep Tracker</title><style>body{font:14px system-ui;margin:0;background:#0b1020;color:#eef3ff}main{max-width:1200px;margin:auto;padding:24px}.tabs,.grid,.days{display:grid;gap:10px}.tabs{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.days{grid-template-columns:repeat(4,1fr)}section,.card{background:#121a2b;border:1px solid #293650;border-radius:12px;padding:14px;margin:12px 0}.card{background:#172238}.muted{color:#9eabc4}button,input,select{background:#172238;color:#eef3ff;border:1px solid #293650;border-radius:8px;padding:9px}button{cursor:pointer}.active{background:#72a7ff;color:#07101f}.done{border-color:#5bd49b}.today{outline:2px solid #72a7ff}.table{width:100%;border-collapse:collapse;min-width:800px}.table td,.table th{padding:8px;border-bottom:1px solid #293650;text-align:left}.tablewrap{overflow:auto}.bar{height:8px;background:#202b41}.bar i{display:block;height:100%;background:#72a7ff}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{background:#121a2b;padding:20px;border-radius:14px;max-width:700px;width:90%;max-height:90%;overflow:auto}.task{background:#0d1525;padding:12px;margin:8px 0;border-radius:8px}.log{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:6px;margin:6px 0}@media(max-width:800px){.grid,.days,.tabs{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.days,.tabs,.log{grid-template-columns:1fr}}</style></head><body><main><header><h1>Placement Prep Tracker</h1><p class="muted">8 weeks • 56 days • 28 companies</p><button id="export">Export backup</button> <button id="reset">Reset</button></header><nav class="tabs" id="tabs"></nav><div id="app"></div></main><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><script>

"Heaps I|Heapify, build-heap, heap sort and priority queues|215, 1046, 973, GFG K-sorted array|SQL SELECT/WHERE/ORDER BY|TPO willingness and deadlines","Heaps II|Top-K, tuple heaps and merge-k|347, 23, 767, 621|SQL joins|Rewrite quantified resume bullets","Heaps III|Two-heaps median and heap+greedy|295, 373, 378, 502|GROUP BY/HAVING|Finalize resume and GitHub READMEs","Hashing practice|Frequency maps and prefix-sum hashmap|1, 49, 560, 128|Subqueries, CASE|Pandas basics","Sliding window|Fixed vs variable window|3, 1004, 76*, 239*|25 timed quant|Pandas merge/pivot/missing values","Two pointers + prefix sums|Sorted two pointers and prefix/suffix arrays|15, 11, 42*, 238|25 data-interpretation|NumPy and matplotlib","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Confirm resume, READMEs, willingness","Tries|Trie insert/search/startsWith|208, 211, 648, 212*|Advanced CTE/subquery SQL|Choose project, dataset, repo, problem statement","Graph basics|Adjacency list/matrix and BFS/DFS|200, 733, 695, 994|25 logical|Download data and EDA","Graphs II|Cycle detection and bipartite|207, 133, 785, 130|Window ranking SQL|Spatial split to avoid leakage","Topological sort|Kahn and DFS topological sort|210, 802, 310*, 1462*|LAG/LEAD SQL|Train baseline and record metric","BFS shortest paths|Multi-source and implicit-state BFS|127, 1091, 542, 752|20 quant + 10 verbal|Evaluate baseline","Mixed graphs|Border/target reasoning and grid states|417, 1020, 841, 827*|5 medium SQL|First README","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Push notebook/README","Dijkstra|Heap Dijkstra and Bellman-Ford overview|743, 1631, 787, 1514|25 quant|Sklearn pipelines, CV, metrics","Union-Find|Path compression and union by rank|547, 684, 721, 947*|Self-joins; gaps/islands|Features, scaling, imbalance","MST + all-pairs|Kruskal, Prim, Floyd-Warshall|1584, 1334, 778*, 332*|30-question timed|Trees, RF, XGBoost","1D DP intro|Memoisation, tabulation and state|70, 198, 213, 91|Date/string/NULL SQL|Improve model; log experiments","1D DP II|Take/skip choice DP|322, 300, 139, 152|Data interpretation + logical|Stats refresh","Grid DP|2D path/min-cost DP|62, 63, 64, 221*|5 medium SQL|Bayes and expectation","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Optional OSMnx + Dijkstra/A*","0/1 knapsack|Subset-sum states|416, 494, 1049*, 474*|10 medium SQL|B CNN OR UI JavaScript","Unbounded knapsack|Counting ways vs minimising|518, 279, 377, 983*|25 quant|B transfer learning OR UI async","LCS + string DP|LCS and edit distance|1143, 72, 5, 647|5 SQL|B U-Net OR UI JS arrays","String DP + LIS|LIS O(n log n)|516, 97*, 115*, 354*|25 logical|B training tricks OR UI React","Stocks + interval DP|State-machine and interval DP|122, 309, 714, 312*|5 SQL|B FastAPI OR UI React forms","Mixed DP timed|Weakest DP first; unseen problems|3 unseen DP + re-solve|30-min sectional|Integrate model OR build API app","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Choose B/UI/both","Greedy I|Exchange argument and sorting|55, 45, 134, 435|OS processes/threads|25 quant","Greedy II + intervals|Merging and sweeping|56, 57, 452, 763|OS mutex/deadlock|Clean project repo","Backtracking I|Choose/explore/un-choose|78, 90, 46, 39|DBMS normalization/ACID|Final README","Backtracking II|Grid backtracking|79, 131, 22, 51*|DBMS indexing/transactions|25 logical","Trees/lists/stacks|Traversals, LCA, BST, linked lists|236, 98, 146, 84*|Networks + OOP|Dockerfile + FastAPI","Binary search + bits|Answer-space binary search and bit tricks|875, 1011, 33, 136|System design basics|Demo/screenshots/public commit","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Verify repo and README","Timed test #1|90-minute no-notes simulation|Easy + 2 mediums + upsolve|5 SQL / 30m|Record time","Weak-spot drill|Pick two weakest topics|2 problems per weak topic|30-min aptitude|B pandas OR UI/SW OS+DBMS","Timed test #2 + LLD|Classes, interfaces, relationships|2 mediums + Parking Lot + Elevator/Library|Top-N SQL|25 quant","HLD + re-solves|URL shortener and rate limiter|4 mistake-log re-solves|60-min aptitude|B ML OR UI/SW revision","Timed test #3|Three-hour easy/medium/hard|3 problems + upsolve|5 SQL|Log results","Company-style set|Product-firm DSA + machine coding|Hard graph/DP + medium + mini system|CS flashcards|25 logical","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Carry 3 weakest topics","Behavioural prep|90-second CS + Geoinformatics story|2 maintenance problems|5 STAR stories|Record and remove filler","Project + thesis pitch|3-minute and 10-minute versions|2 maintenance problems|Why geoinformatics/company|Present and note gaps","Mock interview #1|45-minute peer mock|2 mock DSA + re-solve|5 SQL + 25 quant|Feedback and fix list","ML + stats drill|40 ML/stats questions|2 maintenance problems|Explain 5 concepts|UI/SW OS/DBMS alternative","Mock interview #2|CS fundamentals + project deep dive|2 maintenance problems|60-min aptitude|Fix weak answers","SQL + Python drill|10 timed medium/hard SQL|2 maintenance problems|Windows/self-joins/gaps/top-N|Python idioms + documents","Review / rest|Redo hinted problems and timed set|3-4 re-solves|Portal check|Confirm Week 8 mocks","Product-tier revision|Google, Flipkart, Eterna, Lyric|Hard graph/DP/array/heap/window|Machine coding/LLD|Re-read JDs","Data-tier revision|Infoedge, Nexus, Aviso, C3ihub, Olyv, Sirius AI, GNA|SQL + pandas + 2 DSA|25 mixed aptitude|Revise project","Service/safety tier|Infosys, Tescra, QuickSell, Deloitte, Accordion, Iqvia, FN Mathlogic|3 medium coding + speed-run|Aptitude + verbal|Guesstimates + profitability cases","Full mock #1|3-hour no-notes set|3-4 problems + review|5 SQL|Log time","Full mock #2 + interview|2-hour set + 45-min mock|2 mediums + hard|25 mixed aptitude|Update company statuses","Light day|No new topics; revise mistake log|4 favourite re-solves|Company/deadline check|Sleep early","Final review|Four hardest problems and next 30 days|4 hardest re-solves|Update every company|2 problems/day + weekly contest + rest"
].map(function(x){return x.split("|")});

var state=JSON.parse(localStorage.getItem("ppt-v1")||"null")||{start:"",done:{},company:{},notes:{},mistakes:[]},view="dashboard";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function save(){localStorage.setItem("ppt-v1",JSON.stringify(state))}function cur(){return state.start?Math.floor((new Date()-new Date(state.start+"T00:00:00"))/86400000)+1:0}
function render(){document.getElementById("tabs").innerHTML=["dashboard","days","companies","mistakes"].map(function(x){return '<button class="'+(view==x?"active":"")+'" onclick="view=\''+x+'\';render()">'+x[0].toUpperCase()+x.slice(1)+'</button>'}).join("");({dashboard:dash,days:dayview,companies:compview,mistakes:mistakeview}[view])()}
function dash(){var n=Object.values(state.done).filter(Boolean).length,p=Math.round(n/56*100),t=cur();document.getElementById("app").innerHTML='<div class="grid"><section><span class="muted">Days complete</span><h2>'+n+'/56</h2><div class="bar"><i style="width:'+p+'%"></i></div></section><section><span class="muted">Progress</span><h2>'+p+'%</h2></section><section><span class="muted">Companies touched</span><h2>'+Object.values(state.company).filter(Boolean).length+'/28</h2></section><section><span class="muted">Start date</span><h2 style="font-size:17px">'+esc(state.start||"Not set")+'</h2></section></div><section><h2>Start date</h2><input type="date" value="'+esc(state.start)+'" onchange="state.start=this.value;save();render()"> <span class="muted">'+(t>0&&t<=56?"Today: Day "+t+" — "+esc(days[t-1][0]):"Set a date to highlight today.")+'</span></section><section><h2>8 weeks at a glance</h2><div class="grid">'+weeks.map(function(w,i){return '<div class="card"><b>Week '+(i+1)+'</b><br>'+esc(w)+'</div>'}).join("")+'</div></section>'}
function dayview(){document.getElementById("app").innerHTML='<section><input id="q" placeholder="Search days..." oninput="filter(this.value)"><div class="days" id="days"></div></section>';filter("")}
function filter(q){document.getElementById("days").innerHTML=days.map(function(d,i){return {d:d,i:i}}).filter(function(x){return x.d.join(" ").toLowerCase().indexOf(q.toLowerCase())>=0}).map(function(x){var d=x.d,i=x.i;return '<article class="card '+(state.done[i+1]?"done ":"")+(cur()==i+1?"today":"")+'><b>Day '+(i+1)+' — '+esc(d[0])+'</b><p>'+esc(d[1])+'</p><label><input type="checkbox" '+(state.done[i+1]?"checked":"")+' onchange="state.done['+(i+1)+']=this.checked;save();render()"> Complete</label><br><button onclick="openDay('+i+')">Open</button></article>'}).join("")}
function openDay(i){var d=days[i];document.getElementById("modalbox").innerHTML='<button onclick="closeM()">Close</button><h2>Day '+(i+1)+' — '+esc(d[0])+'</h2><div class="task"><b>LEARN</b><br>'+esc(d[1])+'</div><div class="task"><b>SOLVE</b><br>'+esc(d[2])+'</div><div class="task"><b>SQL / APT / CS</b><br>'+esc(d[3])+'</div><div class="task"><b>TRACK</b><br>'+esc(d[4])+'</div><div class="task"><b>LOG</b><br>Mistake log, 10 min: record the pattern and what you missed for every failed problem.</div><label><input type="checkbox" '+(state.done[i+1]?"checked":"")+' onchange="state.done['+(i+1)+']=this.checked;save();closeM();render()"> Mark complete</label>';document.getElementById("modal").classList.add("show")}
function closeM(){document.getElementById("modal").classList.remove("show")}
function compview(){var r=companies.map(function(c,i){var s=state.company[i]||"Not started";return '<tr><td>'+(i+1)+'</td><td><b>'+esc(c[0])+'</b><br>'+esc(c[1])+'</td><td>'+esc(c[2])+'</td><td>'+esc(c[3])+'</td><td><select onchange="state.company['+i+']=this.value;save();render()"><option '+(s=="Not started"?"selected":"")+'>Not started</option><option '+(s=="Willing"?"selected":"")+'>Willing</option><option '+(s=="Applied"?"selected":"")+'>Applied</option><option '+(s=="Test"?"selected":"")+'>Test</option><option '+(s=="Interview"?"selected":"")+'>Interview</option><option '+(s=="Offer"?"selected":"")+'>Offer</option><option '+(s=="Rejected"?"selected":"")+'>Rejected</option></select></td><td><input value="'+esc(state.notes["c"+i]||"")+'" onchange="state.notes[\'c'+i+'\']=this.value;save()"></td></tr>'}).join("");document.getElementById("app").innerHTML='<section><p class="muted">These are the PDF’s last-season 2025–26 willingness deadlines; current dates should be checked on the portal.</p><div class="tablewrap"><table class="table"><tr><th>#</th><th>Company / role</th><th>CTC</th><th>Last yr deadline</th><th>Status</th><th>Notes</th></tr>'+r+'</table></div></section>'}
function mistakeview(){document.getElementById("app").innerHTML='<section><h2>Mistake log</h2>'+state.mistakes.map(function(x,i){return '<div class="log"><input value="'+esc(x[0])+'" placeholder="Date" onchange="ml('+i+',0,this.value)"><input value="'+esc(x[1])+'" placeholder="Problem" onchange="ml('+i+',1,this.value)"><input value="'+esc(x[2])+'" placeholder="Pattern" onchange="ml('+i+',2,this.value)"><input value="'+esc(x[3])+'" placeholder="What I missed" onchange="ml('+i+',3,this.value)"><button onclick="state.mistakes.splice('+i+',1);save();render()">Delete</button></div>'}).join("")+'<button onclick="state.mistakes.push([\"\",\"\",\"\",\"\"]);save();render()">+ Add mistake</button></section>'}function ml(i,j,v){state.mistakes[i][j]=v;save()}
document.getElementById("export").onclick=function(){var b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="placement-prep-backup.json";a.click()};document.getElementById("reset").onclick=function(){if(confirm("Reset all tracker data?")){localStorage.removeItem("ppt-v1");location.reload()}};document.getElementById("modal").onclick=function(e){if(e.target===this)closeM()};render();
</script></body></html>
